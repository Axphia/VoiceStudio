[package]
name = "voice_server"
version = "0.1.0"
edition = "2021"
description = "Ultra-low latency real-time voice inference & streaming server in Rust"

[dependencies]
voice_core = { path = "../voice_core" }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.38", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
anyhow = "1.0"

[[bin]]
name = "voice-server"
path = "src/main.rs"
