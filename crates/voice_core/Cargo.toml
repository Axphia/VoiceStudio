[package]
name = "voice_core"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust Audio Preprocessor and DSP engine for VoiceStudio"

[dependencies]
hound = "3.5"
rubato = "0.15"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }

[[bin]]
name = "voice-prep"
path = "src/main.rs"
