[project]
name = "voicestudio"
version = "0.1.0"
description = "Zero-shot voice cloning from video files (XTTS-v2)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "TTS>=0.22.0",
  "transformers==4.46.3",
  "ffmpeg-python",
  "librosa",
  "soundfile",
  "scipy",
  "numpy",
  "noisereduce",
  "onnxruntime==1.23.2",
  "setuptools<81",
  "cutlet",
  "fugashi",
  "unidic-lite",
  "psutil",
  "gradio",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "huggingface-hub>=0.36.2",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchaudio = [{ index = "pytorch-cu121" }]

# Third-party voice engines register here, e.g. in their own pyproject:
#   [project.entry-points."voicestudio.engines"]
#   f5 = "their_package:F5Engine"
[project.entry-points."voicestudio.engines"]

[tool.uv]
managed = true
